# 日常训练只改这份文件。相对路径均相对于 OpenPI 仓库根目录。
# Shell 入口显式读取本文件，不接收额外参数；Python 入口支持 CLI 临时覆盖。
# train_smoke.sh 使用 batch=1、steps=20，并自动生成独立实验名。
schema_version: 2

experiment:
  name: Sing_TeaPi
  preset: low_mem             # low_mem = LoRA；full_ft = 全参；smoke = 短跑
  arm: right                   # both | left | right

data:
  root: ./data
  repo_id: vr/Sing_TeaPi/lerobot_v21
  # null = 双臂用三路，单臂用头部和对应腕部。
  # 可显式设为 [head_color] 或 [head_color, hand_left_color, hand_right_color]。
  cameras: null               # 必须包含 head_color；单臂不能选另一只手的腕部

policy:
  pose:
    parent_frame: base_link   # 目标父坐标系；其他坐标系必须提供 base_to_parent
    ee_frame: flange          # 原始数据/通信为 flange；其他末端需提供 flange_to_tcp
    rotation: rot6d           # rot6d | quaternion (xyzw) | axis_angle (rad)
    base_to_parent: null      # 4x4: T_parent_base；observation = 每帧读取 reference.base_to_parent
    flange_to_tcp: null       # {left: 4x4, right: 4x4}，T_flange_tcp，需真实标定

  state:
    space: eef               # eef | joint | both (EEF + Joint)
    representation: absolute # absolute | relative；相对状态需明确 relative_to
    relative_to: null

  action:
    space: eef               # eef | joint，与 control_quantity 对应
    control_quantity: pose_target # pose_target | joint_position | joint_velocity | eef_twist | joint_torque
    label_source: command    # command | measured；夹爪始终绝对
    representation: component_delta # absolute | component_delta | se3_body_delta | se3_spatial_delta | hybrid_delta
    relative_to: current_measured_pose # 也支持 current_command_pose / previous_command_pose / episode_start_pose / object_pose
    delta_scope: chunk       # chunk 共用参考；step 逐步增量并累积还原
    # absolute 时 relative_to 和 delta_scope 均设为 null。

  timing:
    sample_hz: 30.0          # 目标采样率；与原数据不同时进行插值/重采样
    history_steps: 1         # 状态按时间拼接；图像按时间横向拼图，部署需提供完整历史
    prediction_steps: 50     # H：预测帧数，模型 action_horizon 从此处推导
    execution_steps: null    # K：null 交给部署端；整数写入服务端 metadata
    target_offset_steps: 0   # 第一帧标签相对当前观测的偏移，单位 1/sample_hz
    stride_steps: 1          # 标签间隔，动作频率 = sample_hz / stride_steps

model:
  discrete_state_input: true  # 将当前状态编码进 prompt
  params_path: gs://openpi-assets/checkpoints/pi05_base/params

training:
  batch_size: 8              # 全局 batch，多卡时须可被可见 GPU 数量整除
  num_workers: 4
  num_train_steps: 50000     # 目标总步数；续训时不是额外步数
  seed: 42
  fsdp_devices: 1
  log_interval: 50
  save_interval: 5000
  keep_period: 5000          # null = 仅保留最新 checkpoint
  peak_lr: 2.5e-5
  warmup_steps: 1000
  decay_steps: null          # null = 跟随 num_train_steps
  decay_lr: 2.5e-6

checkpoints:
  base_dir: ./checkpoints
  assets_dir: ./assets
  overwrite: false           # true 会删除同名实验的整个 checkpoint 目录
  resume: false              # true 恢复最新 checkpoint；优先于 overwrite

normalization:
  mode: auto                 # auto | force | skip；修改动作表示/预测长度后应重算
  max_frames: null           # null = 全量；仅影响统计量计算

runtime:
  gpu: "2"                   # 也可设 "0,1"；环境变量 CUDA_VISIBLE_DEVICES 优先
  mem_fraction: 0.9           # 环境变量 XLA_PYTHON_CLIENT_MEM_FRACTION 优先
  use_proxy: false
  proxy: socks5h://127.0.0.1:1080

wandb:
  mode: auto                 # auto = 正常训练开启，smoke 关闭
  project: G2_openpi
